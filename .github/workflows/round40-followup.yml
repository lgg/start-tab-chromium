name: Round 40 apply follow-up

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .audit/round40-followup.patch
      - .github/workflows/round40-followup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .audit/round40-followup.patch
          git apply .audit/round40-followup.patch
          rm -f .audit/round40-followup.patch
          git diff --check

      - name: Commit follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Round 40: reject deleted theme duplication"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
