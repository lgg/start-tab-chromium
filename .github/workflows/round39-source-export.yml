name: Round 39 source export

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - .audit/round39-export-trigger
      - .github/workflows/round39-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact audited master
        uses: actions/checkout@v6
        with:
          ref: bf65e3bbecd846dd8fd3711501bd2d25902d0c5c
          fetch-depth: 1

      - name: Create tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bf65e3bbecd846dd8fd3711501bd2d25902d0c5c"
          git ls-files -z > "$RUNNER_TEMP/tracked-files.zlist"
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import tarfile

          root = pathlib.Path.cwd()
          names = [p.decode() for p in pathlib.Path(os.environ['RUNNER_TEMP'], 'tracked-files.zlist').read_bytes().split(b'\0') if p]
          archive = pathlib.Path(os.environ['RUNNER_TEMP'], 'start-tab-round39-source.tar.gz')
          with tarfile.open(archive, 'w:gz', format=tarfile.PAX_FORMAT) as tf:
              for name in names:
                  tf.add(root / name, arcname=name, recursive=False)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-sha256.txt').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-metadata.txt').write_text(
              f'commit=bf65e3bbecd846dd8fd3711501bd2d25902d0c5c\ntracked_files={len(names)}\nsha256={digest}\n',
              encoding='utf-8',
          )
          print(f'Exported {len(names)} tracked files: {digest}')
          PY

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: round39-exact-source
          path: |
            ${{ runner.temp }}/start-tab-round39-source.tar.gz
            ${{ runner.temp }}/source-sha256.txt
            ${{ runner.temp }}/source-metadata.txt
          retention-days: 1
          if-no-files-found: error
