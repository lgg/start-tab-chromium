name: Portable Round 43 Validation

on:
  pull_request:
    branches:
      - master
    types:
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: portable-round43-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --include=dev --bin-links=true --no-audit --no-fund --loglevel=error

      - name: Run complete regression chain
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build full extension
        env:
          GOOGLE_OAUTH_CLIENT_ID: should-be-ignored.apps.googleusercontent.com
        run: npm run build

      - name: Build blocker-only extension
        env:
          GOOGLE_OAUTH_CLIENT_ID: should-be-ignored.apps.googleusercontent.com
        run: npm run build:blocker-only

      - name: Validate Google-enabled build
        env:
          GOOGLE_OAUTH_CLIENT_ID: ci-validation.apps.googleusercontent.com
        run: npm run build:google

      - name: Clean project workspace
        if: always()
        run: node scripts/clean-ci.mjs
