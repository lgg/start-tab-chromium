name: Round 41 apply audited patch

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .audit/round41-production.patch.gz.b64
      - .github/workflows/round41-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply audited Round 41 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .audit/round41-production.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/round41-production.patch"
          git apply --check "$RUNNER_TEMP/round41-production.patch"
          git apply "$RUNNER_TEMP/round41-production.patch"
          rm -f \
            .audit/round41-production.patch.gz.b64 \
            .audit/round41-export-trigger
          git diff --check

      - name: Commit exact audited result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Round 41: harden navigation and popup races"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
