name: Round 42 source export

on:
  push:
    branches:
      - audit/round42-full-project-20260801

permissions:
  contents: write

jobs:
  export:
    if: github.event.head_commit.message != 'chore(audit): publish Round 42 source index'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/round42-full-project-20260801
          fetch-depth: 0

      - name: Build content-addressed source export and index
        shell: bash
        env:
          AUDITED_SHA: 9d086cbfe5f96a1dc512eabce3ff5b3baf1fd984
        run: |
          set -euo pipefail
          git cat-file -e "${AUDITED_SHA}^{commit}"
          mkdir -p .round42
          git ls-tree -r --name-only "${AUDITED_SHA}" > .round42/tracked-files.txt
          git ls-tree -r --long "${AUDITED_SHA}" > .round42/tree-with-sizes.txt
          git grep -n -I -E 'TODO|FIXME|HACK|XXX|@ts-ignore|@ts-expect-error|eslint-disable|console\.(log|warn|error)|catch[[:space:]]*\([^)]*\)[[:space:]]*\{[[:space:]]*\}' "${AUDITED_SHA}" -- '*.ts' '*.js' '*.mjs' '*.html' '*.css' '*.json' '*.md' > .round42/suspicious-patterns.txt || true
          git grep -n -I -E '^(export[[:space:]]+)?(default[[:space:]]+)?(async[[:space:]]+)?(function|class|interface|type|const|let)[[:space:]]' "${AUDITED_SHA}" -- 'src/**' 'scripts/**' > .round42/symbol-index.txt || true
          git grep -n -I -E 'chrome\.(runtime|storage|tabs|windows|alarms|commands|identity|bookmarks|history|sessions|topSites|notifications|contextMenus|webNavigation|declarativeNetRequest)' "${AUDITED_SHA}" -- 'src/**' > .round42/chrome-api-index.txt || true
          git archive --format=zip --output=.round42/source.zip "${AUDITED_SHA}"
          sha256sum .round42/source.zip > .round42/source.sha256
          printf '%s\n' "commit=${AUDITED_SHA}" "tracked_files=$(wc -l < .round42/tracked-files.txt)" > .round42/metadata.txt

      - name: Publish temporary machine-readable index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .round42/tracked-files.txt .round42/tree-with-sizes.txt .round42/suspicious-patterns.txt .round42/symbol-index.txt .round42/chrome-api-index.txt .round42/source.sha256 .round42/metadata.txt
          git commit -m 'chore(audit): publish Round 42 source index'
          git push origin HEAD:audit/round42-full-project-20260801

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: round42-exact-source
          path: |
            .round42/source.zip
            .round42/source.sha256
            .round42/metadata.txt
            .round42/tracked-files.txt
          if-no-files-found: error
          retention-days: 1
